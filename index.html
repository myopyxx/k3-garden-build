<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d1838">
<title>Дневники Алисы</title>
<meta name="description" content="Маленькая игра для одной девушки и двух котиков">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневники Алисы">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Unbounded:wght@400;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#1d1838; --sky-mid:#4a2a54; --sky-low:#a8687a;
  --moon:#f3e3b0; --ink:#fbf4f6; --muted:#cdbccb;
  --card:#fbf1ec; --card-ink:#3d2140; --card-muted:#7a5b75;
  --glass:rgba(255,255,255,.12); --glass-line:rgba(255,255,255,.22);
  --accent:#c0283c; --accent-hi:#ff7a8c; --accent-lo:#5a0f1c;
  --gold:#f5c84c;
  --script:"Bickham Script Pro 3","Bickham Script Pro","Great Vibes",cursive;
  --ui:"Unbounded",ui-rounded,-apple-system,system-ui,sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --tab-h:70px;
  --spring-soft: linear(0, 0.064, 0.21, 0.387, 0.561, 0.713, 0.834, 0.924, 0.984, 1.021, 1.04, 1.046, 1.044, 1.038, 1.03, 1.022, 1.014, 1.009, 1.004, 1.001, 0.999, 0.998, 0.998, 0.998, 0.998, 0.999, 0.999, 0.999, 1, 1, 1, 1, 1);
  --spring-pop: linear(0, 0.054, 0.188, 0.366, 0.555, 0.734, 0.888, 1.007, 1.091, 1.141, 1.161, 1.16, 1.142, 1.115, 1.085, 1.054, 1.027, 1.006, 0.99, 0.98, 0.975, 0.973, 0.975, 0.979, 0.984, 0.989, 0.994, 0.998, 1.001, 1.003, 1.004, 1.004, 1.004, 1.004, 1.003, 1.002, 1);
}
@supports not (animation-timing-function: linear(0, 1)){
  :root{ --spring-pop:cubic-bezier(.34,1.56,.64,1); --spring-soft:cubic-bezier(.34,1.3,.64,1); }
}
body.team-stefan{--accent:#2f7556;--accent-hi:#86dcae;--accent-lo:#123326}
body.team-edward{--accent:#7a5c10;--accent-hi:#a8822a;--accent-lo:#2e2206}
body.team-jacob{--accent:#a24a1c;--accent-hi:#f39c62;--accent-lo:#3d1606}
body.day{--sky-top:#5b6fae;--sky-mid:#c98fa4;--sky-low:#f4c493}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:400 15px/1.4 var(--ui);color:var(--ink);background:#0c0a18;display:flex;justify-content:center;overflow:hidden;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:14px}
.e{font-family:var(--emoji);font-style:normal;line-height:1}
.num{font-variant-numeric:tabular-nums}

.app{position:relative;width:100%;max-width:440px;height:100%;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 76% 14%, rgba(243,227,176,.45) 0 4%, rgba(243,227,176,.12) 12%, transparent 28%),
             linear-gradient(to bottom,var(--sky-top),var(--sky-mid) 58%,var(--sky-low));transition:background 1s}
@media (min-width:500px){.app{height:min(100%,900px);margin:auto;border-radius:40px;box-shadow:0 30px 90px rgba(0,0,0,.6)}}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s infinite ease-in-out}
@keyframes tw{50%{opacity:.1}}
body.day .stars{opacity:.1}
.scene{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none}
.scene svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(10,5,25,.5))}
.fog{position:absolute;left:-40%;right:-40%;bottom:calc(var(--tab-h) + 60px);height:140px;pointer-events:none;
  background:radial-gradient(ellipse at 30% 60%,rgba(235,220,240,.13),transparent 60%),radial-gradient(ellipse at 75% 70%,rgba(235,220,240,.1),transparent 60%);
  animation:fog 24s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(16%)}}

.glass{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.card{background:var(--card);color:var(--card-ink);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 0 rgba(0,0,0,.18),0 14px 28px rgba(0,0,0,.22)}

.btn{position:relative;min-height:54px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:600 14px/1 var(--ui);letter-spacing:.01em;color:#fff;
  background:linear-gradient(to bottom,var(--accent-hi),var(--accent) 55%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.15),0 6px 0 var(--accent-lo),0 12px 22px rgba(0,0,0,.28);
  transition:transform .8s var(--spring-pop),box-shadow .12s,filter .12s}
.btn .e{font-size:20px}
.btn.pressed{transform:translateY(4px) scale(.95);filter:brightness(1.08);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 var(--accent-lo),0 4px 10px rgba(0,0,0,.25);transition-duration:60ms}
.btn.ghost{color:var(--card-ink);background:linear-gradient(to bottom,#fff,#efe1ea);box-shadow:inset 0 2px 0 #fff,0 6px 0 #c9b2c4,0 12px 22px rgba(0,0,0,.2)}
.btn.ghost.pressed{box-shadow:0 2px 0 #c9b2c4}
.btn:disabled{filter:grayscale(.8) brightness(.85);opacity:.6}

.hud{position:absolute;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
.chip{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 10px;border-radius:19px;font:600 15px/1 var(--ui)}
.chip .e{font-size:20px}
.chip.bump{animation:bump .6s var(--spring-pop)}
@keyframes bump{30%{transform:scale(1.25)}}
.hud .sp{flex:1}
.round{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-size:20px;transition:transform .8s var(--spring-pop)}
.round.pressed{transform:scale(.88);transition-duration:60ms}

.views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 66px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 30px);display:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - var(--tab-h) - env(safe-area-inset-bottom) - 30px),rgba(0,0,0,.55) 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - var(--tab-h) - env(safe-area-inset-bottom) - 30px),rgba(0,0,0,.55) 100%)}
.view.on{display:block;animation:vin .7s var(--spring-soft)}
@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.985)}}
.title{font:400 54px/1.05 var(--script);text-shadow:0 0 18px rgba(243,227,176,.35);margin:0 4px 2px}
.sub{color:var(--muted);font-size:11.5px;margin:0 4px 18px}

.tabs{position:absolute;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));height:calc(var(--tab-h) - 6px);z-index:9;display:flex;padding:6px;border-radius:32px;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09));
  border:1px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter:blur(22px) saturate(1.9) brightness(1.06);backdrop-filter:blur(22px) saturate(1.9) brightness(1.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.14),inset 0 0 18px rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.32)}
.tabs::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 90% at 18% -20%,rgba(255,255,255,.35),transparent 45%),radial-gradient(90% 80% at 100% 120%,rgba(255,255,255,.12),transparent 50%)}
.tab-ind{position:absolute;top:6px;bottom:6px;left:6px;border-radius:26px;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(0,0,0,.18);transition:transform .7s var(--spring-pop),width .7s var(--spring-pop)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:26px;font:600 9.5px/1 var(--ui);color:rgba(255,255,255,.72)}
.tab .e{font-size:24px;transition:transform .8s var(--spring-pop);filter:saturate(.7) opacity(.85)}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"] .e{transform:scale(1.15) translateY(-1px);filter:none}
.tab.pressed .e{transform:scale(.88)}
@media (prefers-reduced-transparency:reduce){.tabs{background:rgba(32,22,46,.97);-webkit-backdrop-filter:none;backdrop-filter:none}}

.home{position:relative;display:flex;flex-direction:column;align-items:center;min-height:100%}
.bubble{position:relative;z-index:2;max-width:92%;min-height:50px;margin-top:6px;padding:8px 20px 6px;border-radius:24px;font:400 32px/1.15 var(--script);text-align:center}
.bubble.pop{animation:bpop .7s var(--spring-pop)}
@keyframes bpop{from{transform:scale(.8)}}
.duo{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%;margin-top:14px}
.pet{position:relative;flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation}
.pet .nm{font:400 34px/1.1 var(--script);color:var(--ink);margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.cat{width:100%;transform-origin:50% 100%}
.cat .breathe{transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite}
.cat.lap .breathe{animation-delay:-1.3s}
@keyframes breathe{50%{transform:scale(1.012,1.03)}}
.cat svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 16px 20px rgba(0,0,0,.45))}
.cat .tail{transform-origin:150px 196px;animation:sway 3.4s infinite ease-in-out}
.cat.lap .tail{animation-delay:-1.6s}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.cat .eye{transform-box:fill-box;transform-origin:center;transition:transform 80ms}
.cat.blink .eye{transform:scaleY(.08)}
.acc{display:none}
.wear-cape .acc-cape,.wear-bow .acc-bow,.wear-ring .acc-ring,.wear-tiara .acc-tiara,.wear-wreath .acc-wreath{display:inline}
.sparkle{position:absolute;inset:0;pointer-events:none;display:none}
body.day .sparkle{display:block}
.sparkle i{position:absolute;width:9px;height:9px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk 1.6s infinite ease-in-out;opacity:0}
@keyframes spk{50%{opacity:1;transform:scale(1.5) rotate(45deg)}}
.meter{z-index:2;width:250px;margin-top:14px;padding:10px 14px;border-radius:18px}
.meter .lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:7px}
.bar{height:10px;border-radius:5px;background:rgba(0,0,0,.25);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-hi));border-radius:5px;transition:width .6s var(--spring-soft)}
.row-btns{z-index:2;display:flex;gap:12px;margin-top:16px;width:100%;max-width:360px}
.row-btns .btn{flex:1}
.now{z-index:2;width:100%;max-width:360px;margin-top:18px}
.now iframe{width:100%;height:244px;border:0;border-radius:16px;display:block;background:rgba(255,255,255,.06)}
.song{border-radius:24px;padding:14px}
.song-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.song-h .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.12)}
.song-h b{display:block;font:400 34px/1.05 var(--script)}
.song-h .sa{display:block;font-size:11px;color:var(--muted)}


.map{position:relative;margin:4px auto 0;max-width:380px;padding-bottom:10px}
.map svg.path{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:14px;margin-bottom:28px;opacity:0;animation:nodeIn .8s var(--spring-pop) forwards}
.node:nth-child(odd){flex-direction:row-reverse}
@keyframes nodeIn{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:none}}
.lvl{position:relative;flex:none;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:38px;
  background:radial-gradient(circle at 35% 28%,var(--accent-hi),var(--accent) 58%,var(--accent-lo));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 7px 0 var(--accent-lo),0 0 34px rgba(255,255,255,.12),0 14px 24px rgba(0,0,0,.35);
  transition:transform .8s var(--spring-pop),filter .6s}
.lvl.pressed{transform:translateY(5px) scale(.94);transition-duration:60ms}
.lvl.locked{filter:grayscale(1) brightness(.6)}
.lvl .badge{position:absolute;right:-4px;top:-4px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;
  font:600 12px/1 var(--ui);color:var(--card-ink);background:var(--card);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.lvl.current::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--moon);opacity:.8;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
.ninfo{flex:1;min-width:0;padding:12px 14px;border-radius:20px}
.ninfo .tag{font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--card-muted);margin-bottom:4px}
.ninfo b{display:block;font:600 13.5px/1.2 var(--ui);margin-bottom:3px}
.ninfo span{display:block;font-size:10.5px;line-height:1.4;color:var(--card-muted)}
.node:nth-child(odd) .ninfo{text-align:right}
.stars3{display:flex;gap:2px;margin-top:6px;font-size:15px}
.node:nth-child(odd) .stars3{justify-content:flex-end}
.stars3 .off{filter:grayscale(1) opacity(.35)}

.polas{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pola{background:#fbf3ea;color:#2b1a2e;padding:8px 8px 10px;border-radius:4px;box-shadow:0 12px 26px rgba(0,0,0,.45);transition:transform .8s var(--spring-pop);cursor:pointer}
.polas .pola:nth-child(odd){transform:rotate(-2.5deg)}
.polas .pola:nth-child(even){transform:rotate(2deg)}
.polas .pola.pressed{transform:scale(.96) rotate(0);transition-duration:80ms}
.pola .ph{aspect-ratio:1;border-radius:2px;background:linear-gradient(135deg,#c98d93,#6d5a86);overflow:hidden;display:grid;place-items:center;color:#fff;text-align:center;font-size:10.5px;padding:8px}
.pola .ph.has{padding:0}
.pola .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pola .ph.lock{background:#2a2333;color:#b8aab4}
.pola .ph.lock .e{display:block;font-size:30px;margin-bottom:6px;filter:grayscale(1)}
.pola .c{font:italic 600 20px/1.05 var(--serif);text-align:center;margin-top:6px}
.viewer{position:absolute;inset:0;z-index:60;display:none;place-items:center;padding:24px;background:rgba(8,5,16,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.viewer.on{display:grid}
.viewer .pola{width:100%;max-width:360px;animation:popIn .8s var(--spring-pop)}
.viewer .pola .c{font-size:26px}
@keyframes popIn{from{transform:scale(.6) rotate(-6deg);opacity:0}}

.group{border-radius:22px;overflow:hidden;margin-bottom:18px}
.glabel{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 8px 8px}
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-top:1px solid rgba(61,33,64,.1);width:100%;text-align:left;color:var(--card-ink)}
.li:first-child{border-top:0}
.li .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(61,33,64,.07)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font:600 12.5px/1.25 var(--ui)}
.li .tx span{display:block;font-size:10.5px;line-height:1.4;color:var(--card-muted);margin-top:2px}
.li.dim .ic{filter:grayscale(1);opacity:.45}
.li.dim .tx b{color:var(--card-muted)}
.li .ok{flex:none;font-size:18px}
.stat{display:flex;gap:10px;margin-bottom:18px}
.stat div{flex:1;padding:14px;border-radius:20px}
.stat b{display:block;font:600 26px/1 var(--ui)}
.stat span{font-size:10px;color:var(--muted)}
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:#d9c9d5;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .7s var(--spring-soft)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.sw:disabled{opacity:.4}
.danger{color:#c0283c!important}
.credits{text-align:center;color:var(--card-muted);font-size:10.5px;line-height:1.7;margin:22px 0 4px}
.price{flex:none;min-width:84px;min-height:38px;padding:0 12px;font-size:12.5px}
.price .e{font-size:15px}

.scrim{position:absolute;inset:0;z-index:20;background:rgba(8,4,16,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow-y:auto;background:linear-gradient(to bottom,#fff8f4,#f5e8ee);color:var(--card-ink);
  border-radius:30px 30px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .7s var(--spring-soft);box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(61,33,64,.25);margin:4px auto 10px}
.shead{display:flex;align-items:center;margin-bottom:12px}
.shead h3{flex:1;font:400 44px/1.05 var(--script);color:var(--card-ink)}
.shead button{min-height:44px;padding:0 6px;color:var(--accent);font:600 13px/1 var(--ui)}
.sheet .group{background:#fff;box-shadow:0 2px 0 rgba(61,33,64,.08),0 6px 16px rgba(61,33,64,.08)}
.sheet p.t{font-size:11.5px;line-height:1.55;color:var(--card-muted);margin:0 4px 14px}
.sheet .glabel{color:var(--card-muted)}
.ticket{position:relative;border-radius:22px;padding:24px 20px;text-align:center;margin-bottom:14px;background:#fff;border:2px dashed #e0b84c;animation:popIn .8s var(--spring-pop)}
.ticket .te{font-size:44px;display:block;margin-bottom:8px}
.ticket b{display:block;font:400 38px/1.1 var(--script);margin-bottom:8px}
.ticket .tt{display:block;color:var(--card-muted);font-size:11.5px;line-height:1.55}

.toast{pointer-events:none;position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:70;display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:24px;color:var(--card-ink);background:rgba(255,248,244,.96);box-shadow:0 14px 34px rgba(0,0,0,.35);
  transform:translateY(-150%);transition:transform .7s var(--spring-soft)}
.toast.on{transform:none}
.toast .ic{width:44px;height:44px;border-radius:14px;background:linear-gradient(to bottom,#ffe08a,#f5c84c);display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 3px 0 #d39f1c}
.toast small{display:block;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--card-muted);font-weight:600}
.toast b{display:block;font:600 13px/1.25 var(--ui)}
.toast span{display:block;font-size:10.5px;color:var(--card-muted)}

.game{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:linear-gradient(to bottom,#120e24,#2a1a3a)}
.game.on{display:flex;animation:vin .6s var(--spring-soft)}
.gbar{position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px}
.gt{flex:1;min-width:0;font:400 34px/1.1 var(--script);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:4px}
.gstat{display:flex;gap:5px}
.gstat .chip{height:34px;padding:0 9px 0 8px;font-size:12.5px;gap:4px}
.gstat .chip .e{font-size:16px}
.garea{position:relative;flex:1;overflow:hidden;touch-action:none}
.ghint{position:absolute;left:0;right:0;top:10px;text-align:center;color:var(--muted);font-size:10.5px;pointer-events:none;padding:0 16px}
canvas.c{display:block;width:100%;height:100%}
.pop-num{position:absolute;z-index:66;pointer-events:none;font:600 18px/1 var(--ui);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}

.overlay{position:absolute;inset:0;z-index:7;display:none;place-items:center;padding:20px;background:rgba(8,5,16,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.overlay.on{display:grid}
.panel{width:100%;max-width:340px;padding:22px 20px 22px;text-align:center;animation:popIn .8s var(--spring-pop)}
.panel .big{font-size:52px;display:block;margin-bottom:2px}
.panel h4{font:400 50px/1.05 var(--script);margin-bottom:4px}
.panel p{color:var(--card-muted);font-size:11.5px;line-height:1.6;margin:8px 0 18px}
.panel .row-btns{margin:0;max-width:none}
.rstars{display:flex;justify-content:center;gap:6px;margin:8px 0 4px;height:62px}
.rstars span{font-size:50px;transform:scale(0);filter:grayscale(1) opacity(.3)}
.rstars span.show{animation:starIn .8s var(--spring-pop) forwards}
.rstars span.on{filter:none}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.reward{display:inline-flex;align-items:center;gap:6px;font:600 20px/1 var(--ui);padding:8px 14px;border-radius:16px;background:rgba(61,33,64,.07);margin-bottom:16px}
.reward[hidden]{display:none}

.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;max-width:380px;margin:0 auto}
.mcard{aspect-ratio:3/4;perspective:700px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .8s var(--spring-soft);transform-style:preserve-3d}
.mcard.up .in,.mcard.ok .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mcard .b{background:radial-gradient(circle at 50% 35%,#5b3a6e,#2a1a3a);border:1px solid var(--glass-line);box-shadow:0 5px 0 rgba(0,0,0,.3);font-size:30px}
.mcard .f{transform:rotateY(180deg);background:var(--card);font-size:44px;box-shadow:0 5px 0 #c9b2c4}
.mcard.ok .f{box-shadow:0 0 0 3px var(--gold),0 5px 0 #c9b2c4}

.room{position:absolute;inset:0;background:linear-gradient(180deg,#2b2236 0%,#3a2d3e 62%,#4b3a3a 62%,#3b2c2c 100%)}
.obj{position:absolute;display:grid;place-items:center;font-family:var(--emoji);line-height:1}
.dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 100px at var(--x,50%) var(--y,50%),rgba(0,0,0,0) 0,rgba(0,0,0,.35) 60%,rgba(4,2,7,.97) 100%)}
.kitty{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;display:grid;place-items:center}
.kitty svg{width:50px}
.glint{position:absolute;width:30px;height:12px;margin:-8px 0 0 -15px;pointer-events:none;opacity:0}
.glint i{position:absolute;top:2px;width:7px;height:7px;border-radius:50%;background:var(--ge);box-shadow:0 0 10px var(--ge)}
.glint i:first-child{left:5px}.glint i:last-child{right:5px}
.glint.on{animation:gl 1.2s}
@keyframes gl{30%,70%{opacity:1}}
.flick{animation:flick .5s}
@keyframes flick{20%,60%{opacity:.2}}

.quiz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:18px}
.qcard{width:100%;max-width:320px;min-height:250px;padding:24px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  transition:transform .45s cubic-bezier(.3,.7,.4,1),opacity .35s;touch-action:none}
.qcard .qe{font-size:56px;margin-bottom:12px}
.qcard b{font:600 19px/1.25 var(--ui)}
.qcard .qs{margin-top:10px;font-size:11px;color:var(--card-muted)}
.qcard.enter{animation:popIn .7s var(--spring-pop)}
.qcard.go-l{transform:translateX(-140%) rotate(-18deg);opacity:0}
.qcard.go-r{transform:translateX(140%) rotate(18deg);opacity:0}
.qbar{width:100%;max-width:320px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.qbar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe9a8)}
.qbtns{display:flex;gap:12px;width:100%;max-width:320px}
.qbtns .btn{flex:1}
.qfb{min-height:36px;font-size:11px;color:var(--muted);text-align:center;max-width:320px;line-height:1.5}

.garden{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;padding:46px 16px 30px;max-width:420px;margin:0 auto}
.bush{position:relative;display:grid;place-items:end center;border-radius:28px;background:radial-gradient(ellipse at 50% 85%,rgba(60,120,80,.45),rgba(20,40,30,0) 70%)}
.bush .leaf{font-size:58px;line-height:1;transform:translateY(6px);filter:brightness(.85);pointer-events:none}
.bush .item{position:absolute;left:50%;bottom:30%;width:78px;height:78px;margin-left:-39px;display:grid;place-items:center;font-size:52px;animation:popIn .55s var(--spring-pop)}
.bush .item.gone{transition:transform .25s,opacity .25s;transform:scale(1.5);opacity:0;pointer-events:none}
.bush .item.wilt{transition:transform .35s,opacity .35s;transform:translateY(22px) scale(.4);opacity:0;pointer-events:none}

.fxc{position:absolute;inset:0;z-index:65;pointer-events:none;width:100%;height:100%}
.m3wrap{position:absolute;inset:0;display:grid;place-items:center;padding:10px 12px 20px}
.m3{position:relative;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);touch-action:none;overflow:hidden}
.gem{position:absolute;left:0;top:0;width:var(--s);height:var(--s);display:grid;place-items:center;font-size:calc(var(--s)*.6);transition:transform .3s cubic-bezier(.3,1.25,.5,1)}
.gem::before{content:"";position:absolute;inset:3px;border-radius:14px;background:rgba(255,255,255,.07);transition:background .2s,box-shadow .2s}
.gem span{position:relative;transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .22s;pointer-events:none}
.gem.sel::before{background:rgba(245,200,76,.3);box-shadow:inset 0 0 0 2px var(--gold)}
.gem.sel span{transform:scale(1.15)}
.gem.pop span{transform:scale(1.6);opacity:0}
.hroom{position:absolute;left:0;right:0;top:0;bottom:84px;background:radial-gradient(ellipse at 50% 30%,#5a4038,#2c1d1c 75%);overflow:hidden}
.hroom::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 64px);pointer-events:none}
.hitem{position:absolute;line-height:1;transition:filter .2s}
.hitem.hint{animation:hintPulse .6s ease-in-out infinite alternate}
@keyframes hintPulse{to{filter:drop-shadow(0 0 10px #ffe08a) drop-shadow(0 0 18px #ffe08a) brightness(1.3)}}
.hlist{position:absolute;left:10px;right:62px;bottom:12px;height:62px;border-radius:22px;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;padding:0 4px}
.hslot{display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .3s}
.hslot .e{font-size:24px}
.hslot small{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hslot.done{opacity:.35}
.hslot.done small{text-decoration:line-through}
.hhint{position:absolute;right:10px;bottom:21px;width:46px;height:46px;font-size:22px}

.splash{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;
  background:radial-gradient(circle at 50% 30%,#4a2a54,#1d1838 70%);transition:opacity .7s,transform .7s}
.splash.off{opacity:0;transform:scale(1.06);pointer-events:none}
.splash .t{font:400 78px/1 var(--script);text-shadow:0 0 24px rgba(243,227,176,.45)}
.splash .s{font:italic 600 22px/1 var(--serif);color:var(--muted);margin-top:8px}
.splash .duo{max-width:320px;margin:20px 0 26px}
.splash .pet{cursor:default}
.splash .btn{min-width:230px;min-height:60px;font-size:15px}
.splash .hint{margin-top:16px;font-size:10.5px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.node{opacity:1}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stars" id="stars"></div>
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 440 300" preserveAspectRatio="none">
      <path fill="#7d5476" opacity=".55" d="M0 190 Q60 150 120 175 T240 160 T360 170 T440 150 V300 H0Z"/>
      <path fill="#4b2f55" opacity=".85" d="M0 220 L14 196 L28 220 L40 186 L56 220 L70 200 L84 222 L100 176 L118 222 L134 204 L150 224 L168 184 L186 224 L200 206 L214 226 L232 190 L250 226 L266 208 L282 226 L300 180 L318 226 L334 204 L350 226 L368 188 L386 226 L402 202 L418 226 L430 192 L440 210 V300 H0Z"/>
      <path fill="#2a1a38" d="M0 232 Q110 206 220 222 T440 214 V300 H0Z"/>
      <rect x="0" y="296" width="440" height="40" fill="#2a1a38"/>
    </svg>
  </div>
  <div class="fog"></div>
  <div class="vignette"></div>

  <header class="hud">
    <div class="chip glass" id="chipDrops" aria-label="Капли"><span class="e">🩸</span><span class="num" id="hDrops">0</span></div>
    <div class="chip glass" id="chipStars" aria-label="Звёзды"><span class="e">⭐</span><span class="num" id="hStars">0</span></div>
    <div class="sp"></div>
    <button class="round glass" id="btnSettings" aria-label="Настройки"><span class="e">⚙️</span></button>
  </header>

  <div class="views">
    <section class="view on" id="v-home" aria-label="Котики">
      <div class="home">
        <div class="bubble glass" id="bubble" aria-live="polite">мрр?</div>
        <div class="duo" id="duo"></div>
        <div class="meter glass">
          <div class="lbl"><span>мурр-шкала</span><span class="num" id="petCount">0</span></div>
          <div class="bar"><b id="petBar"></b></div>
        </div>
        <div class="row-btns">
          <button class="btn ghost" id="btnWardrobe"><span class="e">🎀</span>Гардероб</button>
          <button class="btn ghost" id="btnShop"><span class="e">🛍️</span>Лавка</button>
        </div>
        <div class="row-btns"><button class="btn" id="btnPlay"><span class="e">🌙</span>Играть</button></div>
        <div class="now" id="now" hidden></div>
      </div>
    </section>

    <section class="view" id="v-map" aria-label="Уровни">
      <div class="title">Уровни</div>
      <div class="sub">каждый следующий открывается после предыдущего</div>
      <div class="map" id="map"></div>
    </section>

    <section class="view" id="v-album" aria-label="Альбом">
      <div class="title">Альбом</div>
      <div class="sub">кадры открываются за звёзды</div>
      <div class="polas" id="polas"></div>
    </section>

    <section class="view" id="v-awards" aria-label="Награды">
      <div class="title">Награды</div>
      <div class="sub" id="awCap"></div>
      <div class="stat">
        <div class="glass"><b class="num" id="stPets">0</b><span>поглаживаний</span></div>
        <div class="glass"><b class="num" id="stStars">0</b><span>звёзд из 27</span></div>
      </div>
      <div class="glabel">Достижения</div>
      <div class="group card" id="achList"></div>
    </section>
  </div>

  <nav class="tabs" role="tablist"><span class="tab-ind" id="tabInd" aria-hidden="true"></span>
    <button class="tab" role="tab" aria-selected="true" data-v="v-home"><span class="e">🐱</span>Котики</button>
    <button class="tab" role="tab" aria-selected="false" data-v="v-map"><span class="e">🗺️</span>Уровни</button>
    <button class="tab" role="tab" aria-selected="false" data-v="v-album"><span class="e">📸</span>Альбом</button>
    <button class="tab" role="tab" aria-selected="false" data-v="v-awards"><span class="e">🏆</span>Награды</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div class="shead"><h3 id="sheetTitle"></h3><button id="sheetDone">Готово</button></div>
    <div id="sheetBody"></div>
  </div>

  <div class="viewer" id="viewer"></div>

  <div class="toast" id="toast" role="status"><div class="ic e" id="toastI">🏆</div><div><small>достижение</small><b id="toastT"></b><span id="toastS"></span></div></div>

  <div class="game" id="game" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <div class="gbar">
      <button class="round glass" id="gClose" aria-label="Выйти из уровня"><span class="e">✖️</span></button>
      <div class="gt" id="gTitle"></div>
      <div class="gstat" id="gStat"></div>
    </div>
    <div class="garea" id="garea"></div>
    <div class="overlay" id="result">
      <div class="panel card">
        <h4 id="rTitle"></h4>
        <div class="rstars" id="rStars"></div>
        <p id="rText"></p>
        <div id="rReward" class="reward" hidden><span class="e">🩸</span><span class="num" id="rDrops">+0</span></div>
        <div class="row-btns">
          <button class="btn ghost" id="rAgain">Ещё раз</button>
          <button class="btn" id="rNext">Дальше</button>
        </div>
      </div>
    </div>
  </div>

  <canvas class="fxc" id="fx"></canvas>

  <div class="splash" id="splash">
    <div class="t">Дневники Алисы</div>
    <div class="s">сезон первый</div>
    <div class="duo" id="splashDuo" aria-hidden="true"></div>
    <button class="btn" id="btnStart"><span class="e">🌙</span>Начать</button>
    <div class="hint">🔔 со звуком интереснее: тут мурчат</div>
  </div>
</div>

const FX = (() => {
  const cv = $("#fx"), g = cv.getContext("2d"); let W = 0, H = 0, parts = [], raf = 0, last = 0;
  const fit = () => { const r = app.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio||1); W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr; g.setTransform(dpr,0,0,dpr,0,0); };
  fit(); addEventListener("resize", fit);
  function loop(t){
    const dt = Math.min(.05, (t - last)/1000); last = t;
    g.clearRect(0,0,W,H);
    parts = parts.filter(p => {
      p.life -= dt; if (p.life <= 0) return false;
      p.vx *= p.drag; p.vy = p.vy*p.drag + p.grav*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
      const k = p.life/p.max, a = k < .3 ? k/.3 : 1, sc = k < .3 ? .6 + .4*(k/.3) : 1;
      if (p.e) drawEmoji(g, p.e, p.x, p.y, p.size*sc, p.rot, a);
      else { g.save(); g.globalAlpha = a; g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle = p.col; g.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); g.restore(); }
      return true;
    });
    if (parts.length) raf = requestAnimationFrame(loop); else { raf = 0; g.clearRect(0,0,W,H); }
  }
  function start(){ if (!raf){ last = performance.now(); raf = requestAnimationFrame(loop); } }
  const local = (x,y) => { const r = app.getBoundingClientRect(); return [x - r.left, y - r.top]; };
  return {
    burst(cx, cy, {emojis=["✨"], n=10, speed=[140,320], spread=Math.PI*2, dir=-Math.PI/2, size=[16,26], life=[.6,1.1], grav=500, drag=.98}={}){
      if (reduced()) n = Math.min(n, 3);
      const [x,y] = local(cx, cy);
      for (let i=0;i<n && parts.length<220;i++){
        const a = dir + (Math.random()-.5)*spread, sp = speed[0] + Math.random()*(speed[1]-speed[0]), l = life[0] + Math.random()*(life[1]-life[0]);
        parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grav,drag,rot:(Math.random()-.5)*.6,vr:(Math.random()-.5)*4,life:l,max:l,
          size:size[0]+Math.random()*(size[1]-size[0]),e:emojis[Math.floor(Math.random()*emojis.length)]});
      }
      start();
    },
    confetti(cx, cy, n=60){
      if (reduced()) return;
      const [x,y] = local(cx, cy), cols = ["#f5c84c","#ff7a8c","#9fe0ea","#c9a7ff","#ffffff","#86dcae"];
      for (let i=0;i<n && parts.length<220;i++){
        const a = -Math.PI/2 + (Math.random()-.5)*1.9, sp = 260 + Math.random()*420, l = 1.2 + Math.random()*.9;
        parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grav:900,drag:.975,rot:Math.random()*6,vr:(Math.random()-.5)*14,life:l,max:l,size:8+Math.random()*6,col:cols[i%cols.length]});
      }
      start();
    }
  };
})();
function centerOf(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }
function popNum(text, cx, cy){
  const r = app.getBoundingClientRect(), d = document.createElement("div");
  d.className = "pop-num"; d.textContent = text; d.style.left = (cx - r.left - 16) + "px"; d.style.top = (cy - r.top - 20) + "px";
  app.appendChild(d);
  d.animate([{transform:"translateY(0) scale(.6)",opacity:0},{transform:"translateY(-18px) scale(1.15)",opacity:1,offset:.25},{transform:"translateY(-60px) scale(1)",opacity:0}],{duration:900,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish = () => d.remove();
}
function shake(el, power=8){
  if (reduced()) return;
  const k = []; for (let i=0;i<8;i++){ const p = power*(1-i/8); k.push({transform:`translate(${(Math.random()-.5)*2*p}px,${(Math.random()-.5)*2*p}px) rotate(${(Math.random()-.5)*p*.25}deg)`}); }
  k.push({transform:"none"}); el.animate(k, {duration:320, easing:"linear"});
}
function bumpChip(){ const c = $("#chipDrops"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
function flyDrops(fromEl, n=6){
  const target = $("#chipDrops"); if (!target || !fromEl) return;
  const [tx,ty] = centerOf(target), [fx,fy] = centerOf(fromEl), r = app.getBoundingClientRect();
  for (let i=0;i<n;i++){
    const d = document.createElement("div"); d.className = "e"; d.textContent = "🩸";
    d.style.cssText = `position:absolute;z-index:66;font-size:20px;left:${fx-r.left-10}px;top:${fy-r.top-10}px;pointer-events:none`;
    app.appendChild(d);
    const mx = (Math.random()-.5)*120, my = -60 - Math.random()*60;
    d.animate([{transform:"translate(0,0) scale(.4)",opacity:0},{transform:`translate(${mx}px,${my}px) scale(1.1)`,opacity:1,offset:.35},{transform:`translate(${tx-fx}px,${ty-fy}px) scale(.6)`,opacity:.9}],
      {duration:750 + i*60, easing:"cubic-bezier(.5,0,.6,1)", delay:i*40}).onfinish = () => { d.remove(); snd.coin(); bumpChip(); };
  }
}

function finish(stars, text){

  let extra = "";

  if (n === 6 && stars > 0 && !S.owned.wreath){ S.owned.wreath = 1; S.wear.wreath = true; extra = " Венки из роз уже на котиках."; }
  save(); hud(); applyLook();
  $("#rTitle").textContent = stars === 0 ? "Почти" : stars === 3 ? "Идеально" : "Пройдено";

/* британка на canvas */
function drawCatCanvas(g, x, y, c, s=1, sx=1, sy=1){
  g.save(); g.translate(x, y); g.scale(s*sx, s*sy);
  g.shadowColor = "rgba(255,240,250,.3)"; g.shadowBlur = 14;
  g.fillStyle = c.fur;
  g.beginPath(); g.moveTo(-26,-22); g.quadraticCurveTo(-28,-46,-12,-36); g.fill();
  g.beginPath(); g.moveTo(26,-22); g.quadraticCurveTo(28,-46,12,-36); g.fill();
  g.beginPath(); g.ellipse(0,-12,30,26,0,0,7); g.fill();
  g.shadowBlur = 0;
  g.fillStyle = c.eyes; g.beginPath(); g.arc(-11,-14,6,0,7); g.arc(11,-14,6,0,7); g.fill();
  g.fillStyle = "#141014"; g.beginPath(); g.ellipse(-11,-14,2,4.5,0,0,7); g.ellipse(11,-14,2,4.5,0,0,7); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(-9,-16,1.6,0,7); g.arc(13,-16,1.6,0,7); g.fill();
  g.fillStyle = c.nose; g.beginPath(); g.moveTo(-3,-4); g.lineTo(3,-4); g.lineTo(0,0); g.fill();
  g.restore();
}
function setupCanvas(area){
  const cv = document.createElement("canvas"); cv.className = "c"; area.appendChild(cv);
  const g = cv.getContext("2d"); const st = {cv, g, W:0, H:0};
  st.fit = () => { const dpr = Math.min(2, devicePixelRatio||1); st.W = area.clientWidth; st.H = area.clientHeight; cv.width = st.W*dpr; cv.height = st.H*dpr; g.setTransform(dpr,0,0,dpr,0,0); };
  st.fit(); addEventListener("resize", st.fit);
  return st;
}

/* ---------- 1: ночная охота ---------- */
function lvlHunt(area, done){
  const C = setupCanvas(area), {cv, g} = C;
  const TREATS = [{e:"🐟",v:1,p:.55},{e:"🦐",v:2,p:.25},{e:"🍣",v:3,p:.12}];
  let px = C.W/2, tx = C.W/2, items = [], score = 0, lives = 3, time = 30, spawn = 0, last = 0, raf, keys = {}, freeze = 0, tilt = 0, squash = 0;
  const move = e => { const r = cv.getBoundingClientRect(); tx = Math.max(30, Math.min(C.W-30, e.clientX - r.left)); };
  cv.addEventListener("pointermove", move); cv.addEventListener("pointerdown", move);
  const kd = e => { keys[e.key] = true; }, ku = e => { keys[e.key] = false; };
  addEventListener("keydown", kd); addEventListener("keyup", ku);
  const upd = () => stat(chip("🍽️", score) + chip("❤️", Math.max(0,lives)) + chip("⏱️", Math.ceil(time)));
  upd();
  function draw(){
    g.clearRect(0,0,C.W,C.H);
    const grd = g.createLinearGradient(0,C.H-80,0,C.H); grd.addColorStop(0,"rgba(255,255,255,0)"); grd.addColorStop(1,"rgba(255,255,255,.06)");
    g.fillStyle = grd; g.fillRect(0, C.H-80, C.W, 80);
    items.forEach(it => drawEmoji(g, it.e, it.x, it.y, 34, Math.sin(it.y/40)*.25));
    const cy = C.H - 40, s = squash;
    g.save(); g.translate(px, cy); g.rotate(tilt); g.translate(-px, -cy);
    drawCatCanvas(g, px, cy, CONFIG.alisa, 1, 1 + s*.18, 1 - s*.18);
    g.restore();
  }
  function frame(now){
    const dt = Math.min(.05, (now - last)/1000); last = now;
    if (freeze > 0){ freeze -= dt; raf = requestAnimationFrame(frame); return; }
    if (keys.ArrowLeft) tx = Math.max(30, tx - 420*dt);
    if (keys.ArrowRight) tx = Math.min(C.W-30, tx + 420*dt);
    const prev = px; px += (tx - px) * Math.min(1, dt*14);
    tilt += (((px - prev)/Math.max(dt,.001))*.0004 - tilt) * Math.min(1, dt*10); tilt = Math.max(-.25, Math.min(.25, tilt));
    if (squash > 0) squash = Math.max(0, squash - dt*4);
    time -= dt; const k = 1 - time/30;
    spawn -= dt;
    if (spawn <= 0){
      spawn = .6 - .24*k;
      let e = "🪻", v = 0;
      if (Math.random() > .26){ const r = Math.random(), tot = TREATS.reduce((a,b)=>a+b.p,0); let acc = 0; for (const t of TREATS){ acc += t.p/tot; if (r <= acc){ e = t.e; v = t.v; break; } } }
      items.push({x: 24 + Math.random()*(C.W-48), y: -20, vy: 150 + 130*k + Math.random()*40, e, v});
    }
    const cy = C.H - 40, r0 = cv.getBoundingClientRect();
    items = items.filter(it => {
      it.y += it.vy*dt;
      if (it.y > cy - 50 && it.y < cy + 6 && Math.abs(it.x - px) < 38){
        if (!it.v){ lives--; snd.bonk(); snd.resetCombo(); haptic(40); freeze = .07; shake(area, 9); FX.burst(r0.left+it.x, r0.top+it.y, {emojis:["💢"],n:3}); }
        else { score += it.v; snd.combo(); haptic(6); squash = 1; FX.burst(r0.left+it.x, r0.top+it.y, {emojis:["✨"],n:4,size:[10,16],grav:200}); popNum("+"+it.v, r0.left+it.x, r0.top+it.y-20); }
        upd(); return false;
      }
      return it.y < C.H + 30;
    });
    draw();
    if (Math.floor(time*10) % 5 === 0) upd();
    if (lives <= 0 || time <= 0){
      const st = lives <= 0 ? 0 : score >= 38 ? 3 : score >= 24 ? 2 : score >= 12 ? 1 : 0;
      done(st, lives <= 0 ? "Вербена победила. Набрано " + score + "." : "Набрано " + score + ". Три звезды с 38.");
      return;
    }
    raf = requestAnimationFrame(frame);
  }
  draw();
  intro(area, LEVELS[0], "Веди Алису пальцем по экрану (на компьютере стрелками) и лови лакомства: 🐟 +1, 🦐 +2, 🍣 +3. Вербена 🪻 отнимает сердце. 30 секунд.", () => {
    raf = requestAnimationFrame(t => { last = t; frame(t); });
  });
  return () => { cancelAnimationFrame(raf); removeEventListener("resize", C.fit); removeEventListener("keydown", kd); removeEventListener("keyup", ku); };
}

/* ---------- 2: пары ---------- */
function lvlMemory(area, done){
  const kinds = ["🌙","💍","🦇","🍎","🧶","🐾"];
  const deck = kinds.concat(kinds).map(k => ({k, r:Math.random()})).sort((a,b) => a.r - b.r).map(o => o.k);
  const grid = document.createElement("div"); grid.className = "mem"; area.appendChild(grid);
  let open = [], moves = 0, pairs = 0, lock = false;
  const upd = () => stat(chip("👆", moves) + chip("✨", pairs + "/6")); upd();
  deck.forEach((k, i) => {
    const c = document.createElement("button"); c.className = "mcard"; c.setAttribute("aria-label", "Карта " + (i+1)); c.dataset.k = k;
    c.innerHTML = `<div class="in"><div class="b e">🦇</div><div class="f e">${k}</div></div>`;
    c.style.animation = `popIn .7s var(--spring-pop) ${i*40}ms both`;
    c.onclick = () => {
      if (lock || c.classList.contains("up") || c.classList.contains("ok")) return;
      c.classList.add("up"); snd.tap(); open.push({c,k});
      if (open.length === 2){
        moves++; upd();
        const [a, b] = open;
        if (a.k === b.k){

    const m = new Set();
    for (let r=0;r<ROWS;r++){ let run = 1; for (let c=1;c<=COLS;c++){ if (c < COLS && K[r][c] && K[r][c] === K[r][c-1]) run++; else { if (run >= 3) for (let j=c-run;j<c;j++) m.add(r+","+j); run = 1; } } }
    for (let c=0;c<COLS;c++){ let run = 1; for (let r=1;r<=ROWS;r++){ if (r < ROWS && K[r][c] && K[r][c] === K[r-1][c]) run++; else { if (run >= 3) for (let j=r-run;j<r;j++) m.add(j+","+c); run = 1; } } }
    return [...m].map(s => s.split(",").map(Number));
  }
  function hasMove(K){
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) for (const [dr,dc] of [[0,1],[1,0]]){
      const r2 = r+dr, c2 = c+dc; if (r2 >= ROWS || c2 >= COLS) continue;
      const T = K.map(x => x.slice()); [T[r][c], T[r2][c2]] = [T[r2][c2], T[r][c]];
      if (matchCells(T).length) return true;
    }
    return false;
  }
  function freshKinds(){
    let K;
    do {
      K = [];
      for (let r=0;r<ROWS;r++){ K.push([]); for (let c=0;c<COLS;c++){ let k;
        do { k = rk(); } while ((c >= 2 && K[r][c-1] === k && K[r][c-2] === k) || (r >= 2 && K[r-1][c] === k && K[r-2][c] === k));
        K[r].push(k); } }
    } while (!hasMove(K));
    return K;
  }
  function build(){
    board.innerHTML = ""; const K = freshKinds();
    grid = K.map((row, r) => row.map((k, c) => mk(k, r, c, r - ROWS - 1)));
  }
  function reshuffle(){
    const K = freshKinds();
    grid.forEach((row, r) => row.forEach((t, c) => { t.k = K[r][c]; t.el.firstChild.textContent = t.k; t.el.dataset.k = t.k;
      t.el.animate([{transform:t.el.style.transform+" scale(.6)"},{transform:t.el.style.transform}],{duration:400,easing:"cubic-bezier(.34,1.56,.64,1)"}); }));
    snd.collect();
  }
  function swapTiles(a, b){
    grid[a.r][a.c] = b; grid[b.r][b.c] = a;
    const ar = a.r, ac = a.c; place(a, b.r, b.c); place(b, ar, ac);
  }
  async function resolve(){
    let ms = matchCells(kindsOf()), step = 0;
    while (ms.length){
      step++;
      score += ms.length; upd(); snd.combo(); haptic(8);
      let cx = 0, cy = 0;
      ms.forEach(([r,c]) => { const t = grid[r][c]; if (!t) return; const [x,y] = centerOf(t.el); cx += x; cy += y;
        t.el.classList.add("pop"); if (Math.random() < .5) FX.burst(x, y, {emojis:[t.k,"✨"], n:2, size:[12,18], grav:300}); setTimeout(() => t.el.remove(), 230); grid[r][c] = null; });
      popNum("+" + ms.length + (step > 1 ? " ×" + step : ""), cx/ms.length, cy/ms.length);
      await wait(230);
      for (let c=0;c<COLS;c++){
        let w = ROWS - 1;
        for (let r=ROWS-1;r>=0;r--){ const t = grid[r][c]; if (t){ if (w !== r){ grid[w][c] = t; grid[r][c] = null; place(t, w, c); } w--; } }
        for (let r=w, n=0; r>=0; r--, n++) grid[r][c] = mk(rk(), r, c, -1 - n);
      }
      await wait(320);
      ms = matchCells(kindsOf());
    }
    if (!hasMove(kindsOf())) reshuffle();
  }
  async function trySwap(a, b){
    busy = true; swapTiles(a, b); await wait(210);
    if (!matchCells(kindsOf()).length){ snd.wrong(); shake(a.el, 3); swapTiles(a, b); await wait(230); busy = false; return; }
    snd.resetCombo(); await resolve(); busy = false;
    if (!alive) finishIfDone();
  }
  const cellAt = (x, y) => { const r = board.getBoundingClientRect(); const c = Math.floor((x - r.left)/SZ), rr = Math.floor((y - r.top)/SZ); return (rr >= 0 && rr < ROWS && c >= 0 && c < COLS) ? grid[rr][c] : null; };
  let start = null;
  board.addEventListener("pointerdown", e => { if (!alive || busy) return; const t = cellAt(e.clientX, e.clientY); if (!t) return; start = {t, x:e.clientX, y:e.clientY, moved:false}; });
  board.addEventListener("pointermove", e => {
    if (!start || start.moved || busy || !alive) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y; if (Math.hypot(dx, dy) < SZ*.35) return;
    start.moved = true; const t = start.t;
    const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
    const n = grid[t.r + dr] && grid[t.r + dr][t.c + dc];
    if (sel){ sel.el.classList.remove("sel"); sel = null; }
    if (n) trySwap(t, n);
  });
  board.addEventListener("pointerup", () => {
    if (!start || start.moved || busy || !alive){ start = null; return; }
    const t = start.t; start = null;
    if (!sel){ sel = t; t.el.classList.add("sel"); snd.tap(); return; }
    if (sel === t){ t.el.classList.remove("sel"); sel = null; return; }
    const a = sel; a.el.classList.remove("sel"); sel = null;
    if (Math.abs(a.r - t.r) + Math.abs(a.c - t.c) === 1) trySwap(a, t);
    else { sel = t; t.el.classList.add("sel"); snd.tap(); }
  });
  let ended = false;
  function finishIfDone(){
    if (ended || busy) return; ended = true;
    const st = score >= 90 ? 3 : score >= 55 ? 2 : score >= 25 ? 1 : 0;
    done(st, "Собрано фишек: " + score + ". Три звезды с 90.");
  }
  function frame(now){
    const dt = Math.min(.05, (now - last)/1000); last = now;
    time -= dt; if (Math.floor(time*10) % 5 === 0) upd();
    if (time <= 0){ alive = false; upd(); finishIfDone(); return; }
    raf = requestAnimationFrame(frame);
  }
  fit(); build(); upd();
  addEventListener("resize", fit);
  intro(area, LEVELS[6], "Меняй соседние фишки местами: смахни фишку в сторону или тапни две по очереди. Три и больше одинаковых в ряд исчезают, сверху падают новые, цепочки считаются дважды. 60 секунд.", () => {
    alive = true; snd.resetCombo(); raf = requestAnimationFrame(t => { last = t; frame(t); });
  });
  return () => { alive = false; ended = true; cancelAnimationFrame(raf); removeEventListener("resize", fit); };
}

/* ---------- 8: арканоид с клубком (по мотивам «Magic Ball») ---------- */
function lvlBreak(area, done){
  const C = setupCanvas(area), {cv, g} = C;
  const hint = document.createElement("div"); hint.className = "ghint"; hint.textContent = "веди лапку пальцем, тап = запуск"; area.appendChild(hint);
  const COLS = 7, ROWS = 5, COLORS = [["#d9c2ff","#9f7ae0"],["#ffb3c1","#e0667f"],["#ffe08a","#d9a632"],["#a8ecc4","#4fb184"],["#b9eef5","#58b6c6"]];
  let px = C.W/2, tx = C.W/2, PW = 96, PY = C.H - 70, ball, bricks = [], lives = 3, launched = false, raf, last = 0, running = false, freeze = 0, psq = 0, spin = 0, ended = false;
  function layout(){
    bricks = []; const bw = (C.W - 24)/COLS, bh = 24;
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) bricks.push({x:12 + c*bw + 3, y:64 + r*(bh + 7), w:bw - 6, h:bh, hp:r === 0 ? 2 : 1, col:COLORS[r], alive:true});
  }
  const resetBall = () => { launched = false; ball = {x:px, y:PY - 20, vx:0, vy:0, r:12, sp:360}; };
  const upd = () => stat(chip("🧱", bricks.filter(b => b.alive).length) + chip("❤️", Math.max(0, lives)));
  const move = e => { const r = cv.getBoundingClientRect(); tx = Math.max(PW/2, Math.min(C.W - PW/2, e.clientX - r.left)); };
  function launch(){ if (!running || launched) return; launched = true; const a = -Math.PI/2 + (Math.random() - .5)*.8; ball.vx = Math.cos(a)*ball.sp; ball.vy = Math.sin(a)*ball.sp; snd.jump(); haptic(8); }
  cv.addEventListener("pointermove", move);
  cv.addEventListener("pointerdown", e => { move(e); launch(); });
  const keys = {}; const kd = e => { keys[e.key] = true; if (e.code === "Space"){ e.preventDefault(); launch(); } }, ku = e => { keys[e.key] = false; };
  addEventListener("keydown", kd); addEventListener("keyup", ku);
  function rr(x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
  function draw(){
    g.clearRect(0, 0, C.W, C.H);
    bricks.forEach(b => { if (!b.alive) return;
      const gr = g.createLinearGradient(0, b.y, 0, b.y + b.h); gr.addColorStop(0, b.col[0]); gr.addColorStop(1, b.col[1]);
      g.fillStyle = "rgba(0,0,0,.25)"; rr(b.x, b.y + 3, b.w, b.h, 9); g.fill();
      g.fillStyle = gr; rr(b.x, b.y, b.w, b.h, 9); g.fill();
      g.fillStyle = "rgba(255,255,255,.35)"; rr(b.x + 4, b.y + 3, b.w - 8, 6, 3); g.fill();
      if (b.hp > 1) drawEmoji(g, "🦇", b.x + b.w/2, b.y + b.h/2 + 1, 16);
    });
    const sx = 1 + psq*.12, sy = 1 - psq*.25, w = PW*sx, h = 18*sy;
    g.fillStyle = "rgba(0,0,0,.25)"; rr(px - w/2, PY + 4, w, h, h/2); g.fill();
    const pg = g.createLinearGradient(0, PY, 0, PY + h); pg.addColorStop(0, "#a3a7b0"); pg.addColorStop(1, CONFIG.lapula.shade);
    g.fillStyle = pg; rr(px - w/2, PY, w, h, h/2); g.fill();
    drawEmoji(g, "🐾", px, PY + h/2, 16);
    drawEmoji(g, "🧶", ball.x, ball.y, 24, spin);
  }
  function frame(now){
    const dt = Math.min(.033, (now - last)/1000); last = now;
    if (freeze > 0){ freeze -= dt; raf = requestAnimationFrame(frame); return; }
    if (keys.ArrowLeft) tx = Math.max(PW/2, tx - 480*dt);
    if (keys.ArrowRight) tx = Math.min(C.W - PW/2, tx + 480*dt);
    px += (tx - px)*Math.min(1, dt*18);
    if (psq > 0) psq = Math.max(0, psq - dt*5);
    if (!launched){ ball.x = px; ball.y = PY - 14; }
    else {
      const steps = 3;
      for (let s=0;s<steps;s++){
        ball.x += ball.vx*dt/steps; ball.y += ball.vy*dt/steps; spin += ball.vx*.0004;
        if (ball.x < ball.r){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); snd.tap(); }
        if (ball.x > C.W - ball.r){ ball.x = C.W - ball.r; ball.vx = -Math.abs(ball.vx); snd.tap(); }
        if (ball.y < ball.r + 4){ ball.y = ball.r + 4; ball.vy = Math.abs(ball.vy); snd.tap(); }
        if (ball.vy > 0 && ball.y + ball.r >= PY && ball.y < PY + 16 && Math.abs(ball.x - px) < PW/2 + ball.r){
          const off = Math.max(-1, Math.min(1, (ball.x - px)/(PW/2))), a = -Math.PI/2 + off*1.0;
          ball.sp = Math.min(600, ball.sp*1.025); ball.vx = Math.cos(a)*ball.sp; ball.vy = Math.sin(a)*ball.sp; ball.y = PY - ball.r;
          psq = 1; snd.land(.4); haptic(6); snd.resetCombo();
        }
        for (const b of bricks){
          if (!b.alive) continue;
          const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w)), ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
          const dx = ball.x - nx, dy = ball.y - ny;
          if (dx*dx + dy*dy <= ball.r*ball.r){
            if (Math.abs(dx) > Math.abs(dy)) ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
            else ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
            b.hp--; snd.combo(); haptic(6);
            if (b.hp <= 0){ b.alive = false; const r0 = cv.getBoundingClientRect(); FX.burst(r0.left + b.x + b.w/2, r0.top + b.y + b.h/2, {emojis:["✨"], n:5, size:[10,16], grav:400}); freeze = .03; }
            upd(); break;
          }
        }
        if (Math.abs(ball.vy) < ball.sp*.3) ball.vy = Math.sign(ball.vy || -1)*ball.sp*.3;
      }
      if (ball.y > C.H + 30){
        lives--; upd(); snd.wrong(); snd.resetCombo(); haptic(40); shake(area, 8);
        if (lives <= 0){ end(0, "Клубок укатился. Попробуй ещё."); return; }
        resetBall();
      }
    }
    cv.dataset.bx = Math.round(ball.x); cv.dataset.by = Math.round(ball.y); cv.dataset.vy = Math.round(ball.vy);
    draw();
    if (!bricks.some(b => b.alive)){ end(lives, lives === 3 ? "Ни одного промаха." : "Все блоки разбиты. Сердец осталось: " + lives + "."); return; }
    raf = requestAnimationFrame(frame);
  }
  function end(st, text){ if (ended) return; ended = true; running = false; done(st, text); }
  layout(); resetBall(); draw(); upd();
  intro(area, LEVELS[7], "Лапуля отбивает клубок лапкой. Веди лапку пальцем (или стрелками), тап или пробел запускает клубок. Разбей все блоки, у блоков с летучей мышью два удара. Звёзды за оставшиеся сердца.", () => {
    running = true; snd.resetCombo(); raf = requestAnimationFrame(t => { last = t; frame(t); });
  });
  return () => { running = false; ended = true; cancelAnimationFrame(raf); removeEventListener("resize", C.fit); removeEventListener("keydown", kd); removeEventListener("keyup", ku); };
}

/* ---------- 9: поиск предметов (по мотивам hidden object) ---------- */
function lvlHidden(area, done){
  const ITEMS = [["📔","дневник"],["🗝️","ключ"],["🕯️","свеча"],["💍","кольцо"],["🌿","вербена"],["🍷","бокал"],["🪶","перо"],["🕰️","часы"],["🔮","шар"],["🎻","скрипка"],["🪞","зеркало"],["🗡️","кинжал"],["🍎","яблоко"],["☕","чашка"],["🧸","мишка"],["📷","камера"],["🎩","цилиндр"],["🧣","шарф"],["🕶️","очки"],["📚","книги"],["🦉","сова"],["🧪","колба"],["🧭","компас"],["🪆","матрёшка"],["🧦","носок"],["🪙","монета"],["🔔","колокольчик"],["🧵","нитки"],["🍪","печенье"],["🖋️","ручка"]];
  const TIME = 75, shuffled = ITEMS.map(x => ({x, r:Math.random()})).sort((a,b) => a.r - b.r).map(o => o.x);
  const targets = shuffled.slice(0, 6), others = shuffled.slice(6);
  const room = document.createElement("div"); room.className = "hroom"; area.appendChild(room);
  const list = document.createElement("div"); list.className = "hlist glass"; area.appendChild(list);
  const hintBtn = document.createElement("button"); hintBtn.className = "round glass hhint e"; hintBtn.textContent = "💡"; hintBtn.setAttribute("aria-label", "Подсказка"); area.appendChild(hintBtn);
  let found = 0, time = TIME, alive = false, raf, last = 0, hintUsed = false, ended = false;
  const upd = () => stat(chip("🔍", found + "/6") + chip("⏱️", Math.ceil(Math.max(0, time))));
  const slots = targets.map(([e, n]) => { const s = document.createElement("div"); s.className = "hslot"; s.innerHTML = '<span class="e"></span><small></small>'; s.firstChild.textContent = e; s.lastChild.textContent = n; list.appendChild(s); return s; });
  const COLS = 5, ROWSN = 8, cells = [];
  for (let r=0;r<ROWSN;r++) for (let c=0;c<COLS;c++) cells.push([c, r]);
  cells.sort(() => Math.random() - .5);
  const put = (e, name, isT, i) => {
    const [c, r] = cells[i];
    const b = document.createElement("button"); b.className = "hitem e"; b.textContent = e; b.dataset.name = name; if (isT) b.dataset.t = "1";
    const size = 28 + Math.random()*12;
    b.style.left = `calc(${(c + .3 + Math.random()*.4)/COLS*100}% - ${size/2}px)`;
    b.style.top = `calc(${(r + .3 + Math.random()*.4)/ROWSN*100}% - ${size/2}px)`;
    if (isT) b.style.zIndex = 2;
    b.style.fontSize = size + "px"; const rot = Math.round(Math.random()*60 - 30); b.dataset.rot = rot; b.style.transform = `rotate(${rot}deg)`;
    room.appendChild(b);
  };
  targets.forEach(([e, n], i) => put(e, n, true, i));
  for (let i = 6; i < cells.length - 2; i++){ const [e, n] = others[(i - 6) % others.length]; put(e, n, false, i); }
  room.addEventListener("pointerdown", e => {
    if (!alive) return;
    const it = e.target.closest(".hitem");
    if (it && it.dataset.t === "1" && !it.classList.contains("got")){
      it.classList.add("got"); found++; upd(); snd.collect(true); haptic(12);
      const idx = targets.findIndex(t => t[1] === it.dataset.name), slot = slots[idx];
      const [x1,y1] = centerOf(it), [x2,y2] = centerOf(slot);
      FX.burst(x1, y1, {emojis:["✨","⭐"], n:8, size:[12,20], grav:200});
      it.animate([{transform:`rotate(${it.dataset.rot}deg) scale(1)`},{transform:`translate(${x2-x1}px,${y2-y1}px) rotate(0deg) scale(.6)`, opacity:.2}],{duration:600, easing:"cubic-bezier(.5,0,.3,1)", fill:"forwards"})
        .onfinish = () => { it.remove(); slot.classList.add("done"); slot.animate([{transform:"scale(1.3)"},{transform:"scale(1)"}],{duration:500,easing:"cubic-bezier(.34,1.56,.64,1)"}); };
      if (found >= 6){ alive = false; setTimeout(() => end(), 700); }
    } else {
      time -= 3; upd(); snd.wrong(); haptic(30); shake(room, 4); popNum("−3 с", e.clientX, e.clientY);
    }
  });
  hintBtn.onclick = () => {
    if (!alive || hintUsed) return; hintUsed = true; hintBtn.disabled = true; hintBtn.style.opacity = .4;
    const left = [...room.querySelectorAll('.hitem[data-t="1"]:not(.got)')]; if (!left.length) return;
    const t = left[Math.floor(Math.random()*left.length)]; t.classList.add("hint"); snd.collect(); setTimeout(() => t.classList.remove("hint"), 2600);
  };
  function end(){
    if (ended) return; ended = true; cancelAnimationFrame(raf);
    const st = found < 6 ? 0 : time >= 35 ? 3 : time >= 15 ? 2 : 1;
    done(st, found < 6 ? "Время вышло. Найдено " + found + " из 6." : "Всё найдено. Осталось " + Math.ceil(time) + " с, три звезды с 35.");
  }
  function frame(now){
    if (!alive) return;
    const dt = Math.min(.05, (now - last)/1000); last = now;
    time -= dt; if (Math.floor(time*10) % 5 === 0) upd();
    if (time <= 0){ alive = false; time = 0; upd(); end(); return; }
    raf = requestAnimationFrame(frame);
  }
  upd();
  intro(area, LEVELS[8], "На чердаке у Сальваторе беспорядок. Найди шесть вещей из списка внизу и тапни по ним. Промах отнимает 3 секунды. Одна подсказка 💡 на уровень. 75 секунд.", () => {
    alive = true; raf = requestAnimationFrame(t => { last = t; frame(t); });
  });
  return () => { alive = false; ended = true; cancelAnimationFrame(raf); };
}
